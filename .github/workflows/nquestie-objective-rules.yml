# CI-only review of Grok's M1 objective validation rules.
# Public source and synthetic fixtures only; no private server files.
# Runs the M1 objective-rule tests on synthetic fixtures only.
name: N-Questie objective validation rules (M1)

on:
  push:
    branches:
      - "feat/**"
  pull_request:

jobs:
  objective-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Refuse any tracked private server files
        run: |
          bash tests/check_no_tracked_private.sh
      - name: Exercise private-file guard against malicious Git indexes
        run: |
          bash tests/test_check_no_tracked_private.sh
      - name: Install Lua 5.1 and busted
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks --lua-version=5.1 install busted
      - name: Verify GNU realpath availability and canonical resolution
        run: |
          set -euo pipefail
          realpath --version | head -1 | grep -F 'GNU coreutils'
          test "$(realpath -e -- /)" = "/"
      - name: Parse M1 files with Lua 5.1
        run: luac5.1 -p tools/validation/*.lua tools/validation/fixtures/*.lua cli/validate-objectives.lua
      - name: Standalone Lua 5.1 fixture test
        run: lua5.1 tests/test_nquestie_objective_rules.lua
      - name: Busted spec (M1 only; the inherited suite needs PR #4)
        run: busted -p ".test.lua" tools/validation
      - name: Parse M2.1 / M2.2 schema, standalone suites and synthetic fixtures
        run: |
          luac5.1 -p tools/validation/InputSchema.lua tools/validation/EffectiveSchema.lua cli/validate-m2-input.lua
          luac5.1 -p tests/test_nquestie_m2_input_schema.lua tests/test_nquestie_m2_input_paths.lua tests/test_nquestie_m2_effective_schema.lua
          luac5.1 -p tools/validation/InputSchema.test.lua tools/validation/EffectiveSchema.test.lua
          luac5.1 -p tests/fixtures/m2_input/*.lua tests/fixtures/m2_effective/*.lua
      - name: Run M2.1 strict schema and parser rejections
        run: lua5.1 tests/test_nquestie_m2_input_schema.lua
      - name: Run M2.1 fail-closed symlink and canonical-path regression cases
        run: lua5.1 tests/test_nquestie_m2_input_paths.lua
      - name: Run full M2.2 Step 1 effective-record schema standalone tests
        run: lua5.1 tests/test_nquestie_m2_effective_schema.lua
      - name: Validate synthetic Python-exporter-v3 format through Grok M2.1
        run: lua5.1 cli/validate-m2-input.lua "$GITHUB_WORKSPACE/tests/fixtures/m2_input/private_adapter_v3_synthetic.lua"
      - name: Print synthetic report
        run: lua5.1 cli/validate-objectives.lua
