name: N-Questie Part37 owned source snapshot bounded feasibility (no publish)
on:
  pull_request:
permissions:
  contents: read
jobs:
  owned-snapshot-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install and prove Lua 5.1 and 5.4
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get update -qq
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get install -y --no-install-recommends lua5.1 lua5.4
          lua5.1 -v 2>&1 | grep -E '^Lua 5\.1'
          lua5.4 -v 2>&1 | grep -E '^Lua 5\.4'
      - name: Check twenty registered-writer capture and unknown-writer bypass probes
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            "${lua/lua/luac}" -p Database/compiler.lua
            "${lua/lua/luac}" -p Database/Corrections/QuestieCorrections.lua
            "${lua/lua/luac}" -p tests/compat/nq_gate08_owned_snapshot_feasibility.lua
            output="$RUNNER_TEMP/known-gaps-$lua.log"
            timeout --signal=TERM --kill-after=5s 90s "$lua" tests/compat/nq_gate08_owned_snapshot_feasibility.lua | tee "$output"
            test "$(grep -c '^PASS FEASIBILITY GATE08 OWNED SNAPSHOT ' "$output")" -eq 20
            grep -Fx 'GATE08 OWNED SNAPSHOT: 20/20 BOUNDED CONTRACT CHECKS (NOT IMPLEMENTED)' "$output"
            grep -Fx 'BLOCKED SOURCE CAPTURE: unknown unregistered writers bypass epoch, unsealed copy, client RAM/GC and actual atomic publish' "$output"
          done
      - name: Reject artifacts and package files
        shell: bash
        run: |
          set -euo pipefail
          test ! -e dist/N-Questie.zip
          test ! -e .release-please-manifest.json
