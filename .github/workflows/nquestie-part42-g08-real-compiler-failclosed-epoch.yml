name: N-Questie Part42 real compiler fail-closed source epoch model (test only)
on:
  pull_request:
permissions:
  contents: read
jobs:
  real-compiler-epoch-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Authenticate protected-335 compiler and entire shared stream module
        shell: bash
        run: |
          set -euo pipefail
          sha=8b23c6e2cfa00bb81cb26d40c44fef154e9e0070
          timeout --signal=TERM --kill-after=5s 90s git fetch --no-tags --depth=1 origin "$sha"
          test "$(git rev-parse FETCH_HEAD)" = "$sha"
          mkdir -p "$RUNNER_TEMP/nq-real-compiler-aba/Database" "$RUNNER_TEMP/nq-real-compiler-aba/Modules"
          for file in Database/compiler.lua Modules/QuestieStream.lua; do
            case "$file" in
              Database/compiler.lua) expected=abba0249f44d14711dbdd46bbde969ccffbc2963 ;;
              Modules/QuestieStream.lua) expected=1819aeea11148eae0742810dbd2338410edda238 ;;
              *) echo "G08_UNKNOWN_PUBLIC_SOURCE" >&2; exit 1 ;;
            esac
            test "$(git rev-parse "$sha:$file")" = "$expected"
            git show "$sha:$file" > "$RUNNER_TEMP/nq-real-compiler-aba/$file"
            test -s "$RUNNER_TEMP/nq-real-compiler-aba/$file"
            test "$(git hash-object -- "$RUNNER_TEMP/nq-real-compiler-aba/$file")" = "$expected"
          done
          echo "PUBLIC G08 REAL EPOCH MODEL PROTECTED-335 SOURCE BLOBS VERIFIED"
      - name: Install actual PUC Lua 5.1 and 5.4
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get update -qq
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get install -y --no-install-recommends lua5.1 lua5.4
          lua5.1 -v 2>&1 | grep -F 'Lua 5.1'
          lua5.4 -v 2>&1 | grep -F 'Lua 5.4'
      - name: Execute real unmodified compiler and pool within fictional epoch guard
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            if [ "$lua" = lua5.1 ]; then
              luac5.1 -p tests/compat/nq_part42_g08_real_compiler_epoch_guard_model.lua
            else
              luac5.4 -p tests/compat/nq_part42_g08_real_compiler_epoch_guard_model.lua
            fi
            output="$RUNNER_TEMP/nq-real-epoch-$lua.log"
            NQ_G08_REAL_COMPILER_POOL_ROOT="$RUNNER_TEMP/nq-real-compiler-aba" timeout --signal=TERM --kill-after=5s 90s "$lua" tests/compat/nq_part42_g08_real_compiler_epoch_guard_model.lua | tee "$output"
            grep -Fx 'PUBLIC G08 REAL COMPILER EPOCH MODEL CONTROLS: 33/33 PASS' "$output"
            grep -Fx 'PUBLIC G08 KNOWN UNSAFE: unregistered A-to-B-to-A bypasses a cosmetic epoch; only explicitly certified writers can justify fixture publication.' "$output"
            grep -Fx 'PUBLIC G08 NOT ACCEPTED: any production writer registry, E01-E08 completeness, all-kind atomicity, stream recovery, disk/relog, native client, or release.' "$output"
            test "$(grep -Ec '^PUBLIC G08 ' "$output")" -eq 3
          done
      - name: Confirm no packaging or release output
        shell: bash
        run: |
          set -euo pipefail
          test ! -e dist/N-Questie.zip
          test ! -e .release-please-manifest.json
