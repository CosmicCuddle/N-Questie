name: N-Questie Part37 Gate08 source epoch known-gap witnesses (no publish)
on:
  pull_request:
permissions:
  contents: read
jobs:
  source-epoch-witnesses:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install and prove Lua 5.1 and 5.4
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get update -qq
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get install -y --no-install-recommends lua5.1 lua5.4
          lua5.1 -v 2>&1 | grep -E '^Lua 5\.1'
          lua5.4 -v 2>&1 | grep -E '^Lua 5\.4'
      - name: Characterize twenty-one known-unsafe source-epoch and non-name ABA witnesses
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            "${lua/lua/luac}" -p Database/compiler.lua
            "${lua/lua/luac}" -p Database/Corrections/QuestieCorrections.lua
            "${lua/lua/luac}" -p tests/compat/nq_gate08_source_epoch_known_gaps.lua
            output="$RUNNER_TEMP/known-gaps-$lua.log"
            timeout --signal=TERM --kill-after=5s 90s "$lua" tests/compat/nq_gate08_source_epoch_known_gaps.lua | tee "$output"
            test "$(grep -c '^PASS KNOWN-GAP GATE08 SOURCE EPOCH WITNESS ' "$output")" -eq 21
            grep -Fx 'GATE08 SOURCE EPOCH KNOWN-GAPS: 21/21 CHARACTERIZED (NOT FIXED)' "$output"
            grep -Fx 'BLOCKED E01-E08: no source-writer exclusion, no source A-B-A epoch, no guarded publication, no client QA' "$output"
          done
      - name: Reject artifacts and package files
        shell: bash
        run: |
          set -euo pipefail
          test ! -e dist/N-Questie.zip
          test ! -e .release-please-manifest.json
