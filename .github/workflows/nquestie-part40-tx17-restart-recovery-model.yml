name: N-Questie Part40 TX17 fail-closed restart-selection contract (test only)
on:
  pull_request:
permissions:
  contents: read
jobs:
  fictional-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install actual Lua 5.1 and 5.4
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get update -qq
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get install -y --no-install-recommends lua5.1 lua5.4
          lua5.1 -v 2>&1 | grep -F 'Lua 5.1'
          lua5.4 -v 2>&1 | grep -F 'Lua 5.4'
      - name: Run fictional two-slot restore and torn-write controls
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            if [ "$lua" = lua5.1 ]; then
              luac5.1 -p tests/compat/nq_gate08_tx17_savedvariables_restart_model.lua
            else
              luac5.4 -p tests/compat/nq_gate08_tx17_savedvariables_restart_model.lua
            fi
            output="$RUNNER_TEMP/nq-tx17-$lua.log"
            timeout --signal=TERM --kill-after=5s 100s "$lua" tests/compat/nq_gate08_tx17_savedvariables_restart_model.lua | tee "$output"
            grep -Fx 'PUBLIC TX17 FICTIONAL RECOVERY CONTROLS: 39 PASS' "$output"
            grep -Fx 'PUBLIC TX17 KNOWN LIMIT: checksums are not writer authentication.' "$output"
            grep -Fx 'PUBLIC TX17 NOT ACCEPTED: WoW client disk serialization, crash atomicity, SavedVariables provenance, full source epoch, real relog or production integration.' "$output"
            test "$(grep -Ec '^PUBLIC TX17 ' "$output")" -eq 3
          done
      - name: No packaged output
        shell: bash
        run: |
          set -euo pipefail
          test ! -e dist/N-Questie.zip
          test ! -e .release-please-manifest.json
