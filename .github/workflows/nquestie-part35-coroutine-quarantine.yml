name: N-Questie Part35 suspended coroutine quarantine research

on:
  pull_request:

permissions:
  contents: read

jobs:
  quarantine-driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install actual Lua interpreters
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get update -qq
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get install -y --no-install-recommends lua5.1 lua5.4
          lua5.1 -v 2>&1 | grep -E '^Lua 5\.1'
          lua5.4 -v 2>&1 | grep -E '^Lua 5\.4'
      - name: Verify isolated exact production source is unchanged
        shell: bash
        env:
          PIN: 8b23c6e2cfa00bb81cb26d40c44fef154e9e0070
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/nq335" "$PIN"
          test "$(git -C "$RUNNER_TEMP/nq335" rev-parse HEAD)" = "$PIN"
          test "$(git -C "$RUNNER_TEMP/nq335" hash-object Database/compiler.lua)" = abba0249f44d14711dbdd46bbde969ccffbc2963
          test "$(git -C "$RUNNER_TEMP/nq335" hash-object Modules/QuestieStream.lua)" = 1819aeea11148eae0742810dbd2338410edda238
          test -z "$(git -C "$RUNNER_TEMP/nq335" status --porcelain --untracked-files=no)"
      - name: Verify 12 fail-stop quarantine and terminal-cleanup contracts on both Luas
        shell: bash
        run: |
          set -euo pipefail
          luac5.1 -p tests/compat/nq_compiler_driver_quarantine_part35.lua
          luac5.4 -p tests/compat/nq_compiler_driver_quarantine_part35.lua
          cd "$RUNNER_TEMP/nq335"
          for lua in lua5.1 lua5.4; do
            result="$RUNNER_TEMP/nq-part35-quarantine-$lua.txt"
            timeout --signal=TERM --kill-after=5s 90s "$lua" "$GITHUB_WORKSPACE/tests/compat/nq_compiler_driver_quarantine_part35.lua" | tee "$result"
            test "$(grep -c '^PASS QUARANTINE ' "$result")" -eq 12
            grep -Fx 'QUARANTINE CONTRACT RESULT: 12/12 PASS' "$result"
            grep -Fx 'TEST ONLY: fail-stop suspended-thread quarantine, original compiler untouched' "$result"
            echo "VERIFIED quarantine 12/12 under $lua"
          done
