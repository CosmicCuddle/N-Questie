name: N-Questie Part43 G08 real reader shadow generation adapter (test only)
on:
  pull_request:
permissions:
  contents: read
jobs:
  real-reader-shadow-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Pin unchanged original protected 335 QuestieDB reader source
        shell: bash
        run: |
          set -euo pipefail
          sha=8b23c6e2cfa00bb81cb26d40c44fef154e9e0070
          path=Database/QuestieDB.lua
          oid=5784cb65160175e1dce30fe20e8baada0af7e480
          timeout --signal=TERM --kill-after=5s 90s git fetch --no-tags --depth=1 origin "$sha"
          test "$(git rev-parse FETCH_HEAD)" = "$sha"
          test "$(git rev-parse "$sha:$path")" = "$oid"
          mkdir -p "$RUNNER_TEMP/nq-original-reader-adapter/Database"
          git show "$sha:$path" > "$RUNNER_TEMP/nq-original-reader-adapter/$path"
          test "$(git hash-object "$RUNNER_TEMP/nq-original-reader-adapter/$path")" = "$oid"
          echo "PUBLIC G08 PINNED ORIGINAL 335 REAL READER SOURCE VERIFIED"
      - name: Install Lua 5.1 and Lua 5.4 only for source-backed tests
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get update -qq
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get install -y --no-install-recommends lua5.1 lua5.4
          lua5.1 -v 2>&1 | grep -F 'Lua 5.1'
          lua5.4 -v 2>&1 | grep -F 'Lua 5.4'
      - name: Execute real original reader with fictional generation adapter
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            if test "$lua" = lua5.1; then
              luac5.1 -p tests/compat/nq_part43_g08_real_reader_shadow_generation_adapter.lua
            else
              luac5.4 -p tests/compat/nq_part43_g08_real_reader_shadow_generation_adapter.lua
            fi
            logfile="$RUNNER_TEMP/nq-reader-adapter-$lua.log"
            NQ_G08_READER_ADAPTER_ROOT="$RUNNER_TEMP/nq-original-reader-adapter" timeout --signal=TERM --kill-after=5s 90s "$lua" tests/compat/nq_part43_g08_real_reader_shadow_generation_adapter.lua | tee "$logfile"
            grep -Fx 'PUBLIC G08 PART43 REAL READER SHADOW ADAPTER: 48/48 PASS' "$logfile"
            grep -Fx 'PUBLIC G08 TEST-ONLY CONTRACT: unchanged original reader builds each private generation; only a model dispatch pointer moves after all four handles succeed; BUSY/RETRY/ERROR keep old queries.' "$logfile"
            grep -Fx 'PUBLIC G08 NOT ACCEPTED: new coordinator API and GetDBHandle stub are fictional; no production 335 query dispatcher, E01-E08/QuestieStream ownership, real disk/native IP or ZIP/install/merge/release.' "$logfile"
            test "$(grep -Ec '^PUBLIC G08 ' "$logfile")" -eq 3
          done
      - name: Prevent package generation and checkout changes
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -d releases
          test ! -d dist
          test ! -d Questie-335
          test ! -e N-Questie.zip
          test ! -e Questie.zip
