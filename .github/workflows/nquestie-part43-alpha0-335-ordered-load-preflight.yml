name: N-Questie Part43 Alpha0 335 ordered-load preflight (no package)
on:
  pull_request:
permissions:
  contents: read
jobs:
  alpha0-ordered-335-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch immutable original public 335 source
        shell: bash
        run: |
          set -euo pipefail
          sha=8b23c6e2cfa00bb81cb26d40c44fef154e9e0070
          timeout --signal=TERM --kill-after=5s 90s git fetch --no-tags --depth=1 origin "$sha"
          test "$(git rev-parse FETCH_HEAD)" = "$sha"
          test "$(git cat-file -t "$sha:Questie-335.toc")" = blob
      - name: Run strict in-memory TOC and XML order checks
        shell: bash
        run: |
          set -euo pipefail
          logfile="$RUNNER_TEMP/nq-part43-ordered-335.log"
          NQ_ALPHA0_SOURCE_SHA=8b23c6e2cfa00bb81cb26d40c44fef154e9e0070 timeout --signal=TERM --kill-after=5s 90s python3 -B tests/compat/nq_part43_alpha0_335_ordered_load_preflight.py | tee "$logfile"
          grep -Fx 'PUBLIC ALPHA0 PART43 ORDERED 335 LOAD PREFLIGHT: 28/28 PASS' "$logfile"
          grep -Fx 'PUBLIC ALPHA0 PLAN: in-memory TOC-ordered active XML traversal; exact-case paths, duplicates, cycle and order mutants checked; NO package.' "$logfile"
          grep -Fx 'PUBLIC ALPHA0 NOT ACCEPTED: XML runtime semantics, native 3.3.5a/IP play, SavedVariables, G08, ZIP/build/install/merge/release.' "$logfile"
          test "$(grep -Ec '^PUBLIC ALPHA0 ' "$logfile")" -eq 3
      - name: Prove no generated addon artifacts or checkout mutations
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -d releases
          test ! -d dist
          test ! -d Questie-335
          test ! -e N-Questie.zip
          test ! -e Questie.zip
