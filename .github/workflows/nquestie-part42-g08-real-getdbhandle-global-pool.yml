name: N-Questie Part42 G08 actual GetDBHandle and global stream leases (test only)
on:
  pull_request:
permissions:
  contents: read
jobs:
  real-getdbhandle-reader-leases:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Pin two exact protected-335 sources by commit tree and staged bytes
        shell: bash
        run: |
          set -euo pipefail
          sha=8b23c6e2cfa00bb81cb26d40c44fef154e9e0070
          timeout --signal=TERM --kill-after=5s 90s git fetch --no-tags --depth=1 origin "$sha"
          test "$(git rev-parse FETCH_HEAD)" = "$sha"
          mkdir -p "$RUNNER_TEMP/nq-handle/Database" "$RUNNER_TEMP/nq-handle/Modules"
          for file in Database/compiler.lua Modules/QuestieStream.lua; do
            case "$file" in
              Database/compiler.lua) expected=abba0249f44d14711dbdd46bbde969ccffbc2963 ;;
              Modules/QuestieStream.lua) expected=1819aeea11148eae0742810dbd2338410edda238 ;;
              *) echo "G08_UNKNOWN_PUBLIC_FILE" >&2; exit 1 ;;
            esac
            test "$(git rev-parse "$sha:$file")" = "$expected"
            git show "$sha:$file" > "$RUNNER_TEMP/nq-handle/$file"
            test -s "$RUNNER_TEMP/nq-handle/$file"
            test "$(git hash-object -- "$RUNNER_TEMP/nq-handle/$file")" = "$expected"
          done
          echo "PUBLIC G08 REAL READER PLUS GLOBAL STREAM SOURCE PINS MATCH"
      - name: Install real Lua 5.1 and Lua 5.4
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get update -qq
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get install -y --no-install-recommends lua5.1 lua5.4
          lua5.1 -v 2>&1 | grep -F 'Lua 5.1'
          lua5.4 -v 2>&1 | grep -F 'Lua 5.4'
      - name: Execute pinned GetDBHandle and actual shared QuestieStream against fictional bytes
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            if [ "$lua" = lua5.1 ]; then
              luac5.1 -p tests/compat/nq_part42_g08_real_getdbhandle_global_pool.lua
            else
              luac5.4 -p tests/compat/nq_part42_g08_real_getdbhandle_global_pool.lua
            fi
            output="$RUNNER_TEMP/nq-real-handle-$lua.log"
            NQ_G08_HANDLE_SOURCE_ROOT="$RUNNER_TEMP/nq-handle" timeout --signal=TERM --kill-after=5s 90s "$lua" tests/compat/nq_part42_g08_real_getdbhandle_global_pool.lua | tee "$output"
            grep -Fx 'PUBLIC G08 REAL GETDBHANDLE GLOBAL POOL CONTROLS: 16/16 PASS' "$output"
            grep -Fx "PUBLIC G08 KNOWN UNSAFE: deliberately premature reader stream return causes live handle to overwrite peer's pooled stream." "$output"
            grep -Fx 'PUBLIC G08 NOT ACCEPTED: normal client violation, all-writer epochs, atomic four-kind RAM publication, SavedVariables disk/relog, or release.' "$output"
            test "$(grep -Ec '^PUBLIC G08 ' "$output")" -eq 3
          done
      - name: No package, installation or release artifact
        shell: bash
        run: |
          set -euo pipefail
          test ! -e dist/N-Questie.zip
          test ! -e .release-please-manifest.json
