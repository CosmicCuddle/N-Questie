name: N-Questie Part36 compiler stage seam (no publish)
on:
  pull_request:
permissions:
  contents: read
jobs:
  gate08-stage-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install and prove both Lua versions
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get update -qq
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get install -y --no-install-recommends lua5.1 lua5.4
          lua5.1 -v 2>&1 | grep -E '^Lua 5\.1'
          lua5.4 -v 2>&1 | grep -E '^Lua 5\.4'
      - name: Execute actual pinned compiler staging and reader on both Lua versions
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            "${lua/lua/luac}" -p Database/compiler.lua
            "${lua/lua/luac}" -p tests/compat/nq_gate08_four_kind_stage_source.lua
            output="$RUNNER_TEMP/stage-$lua.log"
            timeout --signal=TERM --kill-after=5s 90s "$lua" tests/compat/nq_gate08_four_kind_stage_source.lua | tee "$output"
            test "$(grep -c '^PASS GATE08 STAGE ' "$output")" -eq 63
            grep -Fx 'GATE08 SOURCE STAGING RESULT: 63/63 PASS' "$output"
            grep -Fx 'DRAFT ONLY: no writer epoch/ABA, lease recovery, atomic commit, disk recovery or client QA' "$output"
          done
      - name: Reject test artifact packaging
        shell: bash
        run: |
          set -euo pipefail
          test ! -e dist/N-Questie.zip
          test ! -e .release-please-manifest.json
