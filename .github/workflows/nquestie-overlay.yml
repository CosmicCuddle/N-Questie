              "test_generate_custom_quests_json_roots.InvalidJsonRootTests.test_valid_minimal_document_generates_lua",
              "test_generate_custom_quests_numeric_types.NumericJsonTypeTests.test_cli_approved_and_verified_tokens",
              "test_generate_custom_quests_numeric_types.NumericJsonTypeTests.test_cli_numeric_string_revision_token_is_currently_accepted",
              "test_generate_custom_quests_numeric_types.NumericJsonTypeTests.test_cli_revision_tokens_follow_argparse_then_whole",
