              "test_generate_custom_quests_json_roots.InvalidJsonRootTests.test_existing_output_unchanged_with_overwrite",
              "test_generate_custom_quests_json_roots.InvalidJsonRootTests.test_existing_output_unchanged_without_overwrite",
