              "test_nquestie_335_manifest_preflight.ManifestPreflightTests.test_xml_missing_or_duplicate_file_attribute_refused",
              "test_nquestie_335_manifest_preflight.ManifestPreflightTests.test_xml_s_whitespace_only_in_loader_attributes",
