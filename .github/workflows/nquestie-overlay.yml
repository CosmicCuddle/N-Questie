name: N-Questie 3.3.5a overlay checks

on:
  push:
    branches:
      - "335"
      - "feat/**"
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Read-only token: this workflow never needs write access.
permissions:
  contents: read
  actions: read

jobs:
  verify-custom-quest-overlay:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get update -qq
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get install -y lua5.1
      - name: Parse overlay scripts with Lua 5.1
        run: |
          luac5.1 -p Compat/NQuestieCustomQuestData.lua
          luac5.1 -p Compat/NQuestieCustomQuestLoader.lua
          luac5.1 -p Compat/NQuestieExistingQuestCorrections.lua
          luac5.1 -p Compat/NQuestieReviewedQuestLevelCorrections.lua
          luac5.1 -p Compat/NQuestieReviewedEarlyQuestLevels.lua
          luac5.1 -p Compat/NQuestieReviewedClassicChainLevels.lua
          luac5.1 -p Modules/QuestieInit.lua
      - name: Run custom-quest overlay regression
        run: lua5.1 tests/test_nquestie_overlay.lua
      - name: Run guarded custom-loader synthetic contracts (Lua 5.1)
        run: |
          luac5.1 -p tests/compat/nq_custom_loader_safety.lua
          # Fail a non-terminating synthetic mutation before the default job timeout.
          timeout --signal=TERM --kill-after=5s 120s python3 tests/compat/run_nq_custom_loader_safety.py
      - name: Run actual Questie compiler codec on synthetic GO/item objectives (Lua 5.1)
        run: |
          luac5.1 -p tests/compat/nq_custom_compiler_codec.lua
          timeout --signal=TERM --kill-after=5s 120s lua5.1 tests/compat/nq_custom_compiler_codec.lua
      - name: Run synthetic whole-table compiler harness (Lua 5.1)
        run: |
          luac5.1 -p tests/compat/nq_custom_fulltable_compiler.lua
          # Fail a non-terminating compile/reopen before the default job timeout.
          timeout --signal=TERM --kill-after=5s 120s lua5.1 tests/compat/nq_custom_fulltable_compiler.lua
      - name: Run public quest 2001 loader-to-compiler regression (Lua 5.1)
        run: |
          luac5.1 -p tests/compat/nq_public_2001_compiled.lua
          timeout --signal=TERM --kill-after=5s 120s lua5.1 tests/compat/nq_public_2001_compiled.lua
      - name: Test available quest starter marker source contract (Lua 5.1)
        run: |
          luac5.1 -p tests/compat/nq_available_starter_marker_contract.lua
          timeout --signal=TERM --kill-after=5s 120s lua5.1 tests/compat/nq_available_starter_marker_contract.lua
      - name: Test unresolved available quest starter safety (Lua 5.1)
        run: |
          luac5.1 -p tests/compat/nq_available_unresolved_starters.lua
          timeout --signal=TERM --kill-after=5s 120s lua5.1 tests/compat/nq_available_unresolved_starters.lua
      - name: Test reviewed existing quest 1203 correction (no server data)
        run: lua5.1 tests/test_nquestie_existing_quest_1203.lua
      - name: Test verified Dustwallow quest-level changes (no private source)
        run: lua5.1 tests/test_nquestie_reviewed_dustwallow_levels.lua
      - name: Test reviewed early-zone level patches (synthetic records only)
        run: lua5.1 tests/test_nquestie_reviewed_early_quest_levels.lua
      - name: Test guarded Duskwood and Wetlands level corrections (synthetic data)
        run: lua5.1 tests/test_nquestie_reviewed_classic_chain_levels.lua
      - name: Test selected quest SQL export parser
        run: python3 tools/test_export_world_quests.py
      - name: Test reviewed JSON to Lua generation (offline, fail closed)
        run: python3 tools/test_generate_custom_quests.py
      - name: Test private existing-quest level audit (synthetic data only)
        run: |
          python3 -m py_compile tools/audit_world_quest_levels.py
          python3 tools/test_audit_world_quest_levels.py
      - name: Guard approved early quest IDs against changed public Questie source
        run: python3 tools/test_reviewed_early_quest_sources.py
      - name: Verify real public Questie baselines for the two Classic chains
        run: python3 tools/test_reviewed_classic_chain_sources.py
      - name: Check overlay packaging label gate (label and non-documentation path)
        run: python3 tests/ci/check_overlay_packaging_gate.py
      - name: Verify 3.3.5a TOC integration
        run: |
          grep -Fq '## Interface: 30300' Questie-335.toc
          grep -Fq 'Compat\NQuestieCustomQuestData.lua' Questie-335.toc
          grep -Fq 'Compat\NQuestieCustomQuestLoader.lua' Questie-335.toc
          grep -Fq 'Compat\NQuestieExistingQuestCorrections.lua' Questie-335.toc
          grep -Fq 'Compat\NQuestieReviewedQuestLevelCorrections.lua' Questie-335.toc
          grep -Fq 'Compat\NQuestieReviewedEarlyQuestLevels.lua' Questie-335.toc
          grep -Fq 'Compat\NQuestieReviewedClassicChainLevels.lua' Questie-335.toc
          grep -Fq 'nQuestieDataRevision' Modules/QuestieInit.lua
      - name: Determine changed paths for QA packaging (fail closed)
        id: qa_changed_paths
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'nq-qa-ingame-test') }}
        env:
          NQ_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NQ_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # NQ_QA_PATH_GATE_BEGIN
          # Fail closed. package=true only when `git diff --name-only` from the merge
          # base of NQ_BASE_SHA and NQ_HEAD_SHA to NQ_HEAD_SHA lists a path that is not
          # documentation. Documentation (case-sensitive, narrow):
          #   docs/**    path matches docs/*
          #   **/*.md    path matches *.md
          #   LICENSE*   repository-root name matches LICENSE*
          # Empty list, unsafe path, or any git failure: package=false.
          set -u
          export GIT_TERMINAL_PROMPT=0
          export GCM_INTERACTIVE=Never

          finish() {
            if [ -n "${GITHUB_OUTPUT:-}" ]; then
              printf 'package=%s\n' "$1" >> "$GITHUB_OUTPUT"
            fi
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf 'QA packaging changed-path decision: package=%s (%s)\n' "$1" "$2" >> "$GITHUB_STEP_SUMMARY"
            fi
            printf 'package=%s\n' "$1"
            printf 'reason=%s\n' "$2"
            exit 0
          }

          valid_sha() {
            printf '%s' "$1" | grep -Eq '^[0-9a-fA-F]{40}$'
          }

          is_safe_path() {
            local path="$1"
            local rest="$path"
            local seg
            case "$path" in
              ""|/*|*/) return 1 ;;
              *\\*) return 1 ;;
            esac
            while [ -n "$rest" ]; do
              seg="${rest%%/*}"
              case "$seg" in
                ""|.|..) return 1 ;;
              esac
              if [ "$rest" = "$seg" ]; then
                rest=""
              else
                rest="${rest#*/}"
              fi
            done
            return 0
          }

          # Narrow documentation set. Keep in lockstep with docs/NQ-QA-PACKAGING-LABEL-GATE.md.
          is_doc() {
            case "$1" in
              docs/*|*.md|LICENSE*) return 0 ;;
              *) return 1 ;;
            esac
          }

          if ! valid_sha "${NQ_BASE_SHA:-}"; then
            finish false "base SHA missing or not 40 hex"
          fi
          if ! valid_sha "${NQ_HEAD_SHA:-}"; then
            finish false "head SHA missing or not 40 hex"
          fi

          commits_ready() {
            git cat-file -e "${NQ_BASE_SHA}^{commit}" >/dev/null 2>&1 \
              && git cat-file -e "${NQ_HEAD_SHA}^{commit}" >/dev/null 2>&1 \
              && git merge-base "${NQ_BASE_SHA}" "${NQ_HEAD_SHA}" >/dev/null 2>&1
          }

          if ! commits_ready; then
            shallow="$(git rev-parse --is-shallow-repository 2>/dev/null || true)"
            if [ "$shallow" = "true" ]; then
              git fetch --no-tags --unshallow origin >/dev/null 2>&1 || true
            fi
          fi
          if ! git cat-file -e "${NQ_BASE_SHA}^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${NQ_BASE_SHA}" >/dev/null 2>&1 || true
          fi
          if ! git cat-file -e "${NQ_HEAD_SHA}^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${NQ_HEAD_SHA}" >/dev/null 2>&1 || true
          fi
          if ! git cat-file -e "${NQ_BASE_SHA}^{commit}" >/dev/null 2>&1; then
            finish false "base SHA unavailable after fetch"
          fi
          if ! git cat-file -e "${NQ_HEAD_SHA}^{commit}" >/dev/null 2>&1; then
            finish false "head SHA unavailable after fetch"
          fi

          mb="$(git merge-base "${NQ_BASE_SHA}" "${NQ_HEAD_SHA}" 2>/dev/null || true)"
          if ! valid_sha "$mb"; then
            finish false "merge base undeterminable"
          fi

          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          if ! git diff --name-only --no-renames -z "$mb" "${NQ_HEAD_SHA}" -- > "$tmp"; then
            finish false "git diff failed"
          fi
          if [ ! -s "$tmp" ]; then
            finish false "changed-file list empty"
          fi

          found_non_doc=0
          found_any=0
          while IFS= read -r -d '' path; do
            found_any=1
            if ! is_safe_path "$path"; then
              finish false "changed path rejected"
            fi
            if ! is_doc "$path"; then
              found_non_doc=1
            fi
          done < "$tmp"
          if [ "$found_any" -ne 1 ]; then
            finish false "changed-file list empty"
          fi
          if [ "$found_non_doc" -eq 1 ]; then
            finish true "non-documentation path changed"
          fi
          finish false "documentation paths only"
          # NQ_QA_PATH_GATE_END
      # Same predicate on Assemble and Upload. See docs/NQ-QA-PACKAGING-LABEL-GATE.md.
      - name: Assemble PR-only WoW 3.3.5a addon package
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'nq-qa-ingame-test') && steps.qa_changed_paths.outputs.package == 'true' }}
        run: |
          mkdir -p qa-package/Questie-335
          cp Questie.lua Questie-335.toc embeds.xml qa-package/Questie-335/
          cp -R Compat Database Icons Libs Localization Modules qa-package/Questie-335/
          {
            echo "N-Questie custom quest prototype — PR TEST ONLY"
            echo "Not an official release; do not redistribute as a stable Questie build."
            echo "GitHub source commit: $(git rev-parse HEAD)"
            echo "Back up the installed Questie addon and both SavedVariables before installation."
            echo "Install exactly one folder: Interface/AddOns/Questie-335/"
          } > qa-package/Questie-335/QA_BUILD_NOTICE.txt
          test -s qa-package/Questie-335/Questie-335.toc
          test -s qa-package/Questie-335/Compat/NQuestieCustomQuestLoader.lua
          test -s qa-package/Questie-335/Compat/NQuestieCustomQuestData.lua
          test -s qa-package/Questie-335/Compat/NQuestieExistingQuestCorrections.lua
          test -s qa-package/Questie-335/Compat/NQuestieReviewedQuestLevelCorrections.lua
          test -s qa-package/Questie-335/Compat/NQuestieReviewedEarlyQuestLevels.lua
          test -s qa-package/Questie-335/Compat/NQuestieReviewedClassicChainLevels.lua
          echo "QA build only. Run in-game tests before merging or releasing." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload temporary N-Questie PR test build
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'nq-qa-ingame-test') && steps.qa_changed_paths.outputs.package == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: N-Questie-335-PR-TestBuild
          path: qa-package/
          if-no-files-found: error
          retention-days: 7
