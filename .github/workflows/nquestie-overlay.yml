              "test_reviewed_classic_chain_sources.ClassicQuestChainSourceTests.test_prior_level_batches_and_jarl_do_not_overlap",
              "test_reviewed_classic_chain_sources.ClassicQuestChainSourceTests.test_static_numeric_fix_layers_are_accounted_for",
              "test_reviewed_early_quest_sources.EarlyQuestSourceTests.test_all_eleven_source_values_still_match",
              "test_reviewed_early_quest_sources.EarlyQuestSourceTests.test_no_original_static_numeric_corrections_for_these_ids",
              "test_reviewed_early_quest_sources.EarlyQuestSourceTests.test_quest_1203_and_custom_2001_not_in_the_batch",
              "test_world_quest_sql_quoting.SqlQuotingTests.test_carriage_return_inside_a_title_differs_for_a_zip",
              "test_world_quest_sql_quoting.SqlQuotingTests.test_cli_refusal_prints_a_fixed_line",
              "test_world_quest_sql_quoting.SqlQuotingTests.test_double_quoted_comma_is_refused",
              "test_world_quest_sql_quoting.SqlQuotingTests.test_invalid_utf8_is_replaced_without_shifting_levels",
              "test_world_quest_sql_quoting.SqlQuotingTests.test_lf_and_crlf_files_and_zips_keep_the_same_levels",
              "test_world_quest_sql_quoting.SqlQuotingTests.test_odd_trailing_backslash_is_refused_without_the_row",
              "test_world_quest_sql_quoting.SqlQuotingTests.test_parse_row_quotes_do_not_move_numeric_fields",
              "test_world_quest_sql_quoting.SqlQuotingTests.test_real_newline_inside_quotes_is_refused",
              "test_world_quest_sql_quoting.SqlQuotingTests.test_shared_parser_and_fixture_bytes",
              "test_world_quest_sql_quoting.SqlQuotingTests.test_unescaped_apostrophe_corrupts_or_refuses",
          )

          START_RE = re.compile(r"^(\w+) \(([\w.]+)\)(.*)$")
          STATUS_RE = re.compile(
              r" \.\.\. (ok|FAIL|ERROR|expected failure|unexpected success|skipped .+)$"
          )
          BARE_STATUS_RE = re.compile(
              r"^(ok|FAIL|ERROR|expected failure|unexpected success|skipped .+)$"
          )
          SUMMARY_RE = re.compile(
              r"^Ran (\d+) tests? in [0-9.]+s\n\n"
              r"(OK|FAILED|NO TESTS RAN)(?: \(([^)]*)\))?[ \t]*$",
              re.MULTILINE,
          )


          def extract_status(line):
              match = STATUS_RE.search(line)
              if match:
                  return match.group(1)
              match = BARE_STATUS_RE.fullmatch(line.strip())
              if match:
                  return match.group(1)
              return None


          def progress_lines(text):
              lines = []
              for raw in text.splitlines():
                  line = raw.rstrip("\r")
                  if line in ("=" * 70, "-" * 70):
                      break
                  lines.append(line)
              return lines


          def parse_summary(text):
              matches = list(SUMMARY_RE.finditer(text))
              if not matches:
                  return None
              match = matches[-1]
              ran = int(match.group(1))
              status = match.group(2)
              infos = {}
              if match.group(3):
                  for part in match.group(3).split(", "):
                      key, value = part.split("=", 1)
                      infos[key] = int(value) if value.isdigit() else value
              return ran, status, infos


          def parse_discovery(text):
              problems = []
              discovered = []
              outcomes = {}
              pending = None
              lines = progress_lines(text)
              index = 0
              while index < len(lines):
                  line = lines[index]
                  start = START_RE.match(line)
                  if pending is None and start:
                      test_id = start.group(2)
                      if test_id in discovered:
                          problems.append("duplicate test ID in discovery output: " + test_id)
                      discovered.append(test_id)
                      status = extract_status(line)
                      if status is None:
                          pending = test_id
                      else:
                          outcomes[test_id] = status
                      index += 1
                      continue
                  if pending is not None:
                      if start:
                          problems.append(
                              "discovery output ended " + pending + " before a pass/fail/skip status"
                          )
                          outcomes[pending] = "UNREADABLE"
                          pending = None
                          continue
                      status = extract_status(line)
                      if status is not None:
                          outcomes[pending] = status
                          pending = None
                      index += 1
                      continue
                  index += 1
              if pending is not None:
                  problems.append("discovery output ended before a status for " + pending)
                  outcomes[pending] = "UNREADABLE"
              return discovered, outcomes, problems


          def main():
              discover_status = int(sys.argv[1])
              stderr_path = sys.argv[2]
              with open(stderr_path, encoding="utf-8", errors="replace") as handle:
                  stderr_text = handle.read()

              problems = []
              pinned = list(PINNED_TEST_IDS)
              if len(pinned) != len(set(pinned)):
                  duplicates = sorted({item for item in pinned if pinned.count(item) > 1})
                  problems.append(
                      "pinned inventory contains duplicate test IDs: " + ", ".join(duplicates)
                  )
              if EXPECTED_SKIP_ID not in pinned:
                  problems.append(
                      "expected skip ID is not in the pinned inventory: " + EXPECTED_SKIP_ID
                  )

              discovered, outcomes, parse_problems = parse_discovery(stderr_text)
              problems.extend(parse_problems)
              summary = parse_summary(stderr_text)

              if summary is None:
                  problems.append(
                      "could not parse the unittest summary "
                      "(expected a final 'Ran N tests' line and an OK/FAILED line)"
                  )
              else:
                  ran, status, infos = summary
                  detail = ", ".join("%s=%s" % (key, value) for key, value in infos.items())
                  if ran != len(pinned):
                      problems.append(
                          "unittest summary ran %d tests; pinned inventory has %d"
                          % (ran, len(pinned))
                      )
                  if status != "OK":
                      problems.append("unittest summary status is %s, expected OK" % status)
                  if infos != {"skipped": 1}:
                      problems.append(
                          "unittest summary details are %s; expected exactly skipped=1"
                          % (detail or "(none)")
                      )
                  if ran != len(discovered):
                      problems.append(
                          "unittest summary ran %d tests but the verbose log identified %d test IDs"
                          % (ran, len(discovered))
                      )

              if discover_status != 0:
                  problems.append(
                      "python3 -m unittest discover exited %d; expected 0" % discover_status
                  )

              pinned_set = set(pinned)
              discovered_set = set(discovered)
              missing = sorted(pinned_set - discovered_set)
              extra = sorted(discovered_set - pinned_set)
              if missing:
                  problems.append(
                      "missing pinned test IDs (discovery did not run them):\n  - "
                      + "\n  - ".join(missing)
                  )
              if extra:
                  problems.append(
                      "unexpected test IDs (not in the pinned inventory):\n  - "
                      + "\n  - ".join(extra)
                  )

              skips = []
              bad_outcomes = []
              seen = set()
              for test_id in discovered:
                  if test_id in seen:
                      continue
                  seen.add(test_id)
                  outcome = outcomes.get(test_id)
                  if outcome is None or outcome == "UNREADABLE":
                      bad_outcomes.append(test_id + ": outcome was not readable")
                      continue
                  if outcome == "ok":
                      continue
                  if outcome.startswith("skipped"):
                      reason = outcome[len("skipped"):].strip()
                      skips.append((test_id, reason))
                      continue
                  bad_outcomes.append(test_id + ": " + outcome)

              if bad_outcomes:
                  problems.append(
                      "tests that failed, errored, or were not a plain pass:\n  - "
                      + "\n  - ".join(bad_outcomes)
                  )
              if len(skips) != 1:
                  rendered = "\n  - ".join(
                      "%s %s" % (test_id, reason) for test_id, reason in skips
                  ) or "(none)"
                  problems.append(
                      "expected exactly 1 skipped test, found %d:\n  - %s" % (len(skips), rendered)
                  )
              elif skips[0][0] != EXPECTED_SKIP_ID:
                  problems.append(
                      "the skipped test is not the pinned intentional skip:\n"
                      "  expected: %s\n"
                      "  actual:   %s %s" % (EXPECTED_SKIP_ID, skips[0][0], skips[0][1])
                  )

              if problems:
                  print("Python discovery inventory check FAILED.", file=sys.stderr)
                  print("Pinned test IDs: %d" % len(pinned), file=sys.stderr)
                  print("Discovered test IDs: %d" % len(discovered_set), file=sys.stderr)
                  print("Discovery exit status: %d" % discover_status, file=sys.stderr)
                  if summary is not None:
                      ran, status, infos = summary
                      detail = ", ".join("%s=%s" % (key, value) for key, value in infos.items())
                      suffix = " (%s)" % detail if detail else ""
                      print(
                          "Unittest summary: Ran %d / %s%s" % (ran, status, suffix),
                          file=sys.stderr,
                      )
                  print("Expected skip: " + EXPECTED_SKIP_ID, file=sys.stderr)
                  for index, problem in enumerate(problems, 1):
                      print("\n[%d] %s" % (index, problem), file=sys.stderr)
                  sys.exit(1)

              reason = skips[0][1]
              print("Pinned Python discovery inventory matched.")
              print(
                  "Ran %d tests: %d passed, 1 skipped."
                  % (len(discovered_set), len(discovered_set) - 1)
              )
              print("Skipped test: " + EXPECTED_SKIP_ID)
              print("Skip reason: " + reason)


          if __name__ == "__main__":
              main()
          PY
