name: N-Questie 3.3.5a overlay checks

on:
  push:
    branches:
      - "335"
      - "feat/**"
  pull_request:

jobs:
  verify-custom-quest-overlay:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Parse overlay scripts with Lua 5.1
        run: |
          luac5.1 -p Compat/NQuestieCustomQuestData.lua
          luac5.1 -p Compat/NQuestieCustomQuestLoader.lua
          luac5.1 -p Compat/NQuestieExistingQuestCorrections.lua
          luac5.1 -p Compat/NQuestieReviewedQuestLevelCorrections.lua
          luac5.1 -p Compat/NQuestieReviewedEarlyQuestLevels.lua
          luac5.1 -p Compat/NQuestieReviewedClassicChainLevels.lua
          luac5.1 -p Modules/QuestieInit.lua
      - name: Run custom-quest overlay regression
        run: lua5.1 tests/test_nquestie_overlay.lua
      - name: Test reviewed existing quest 1203 correction (no server data)
        run: lua5.1 tests/test_nquestie_existing_quest_1203.lua
      - name: Test verified Dustwallow quest-level changes (no private source)
        run: lua5.1 tests/test_nquestie_reviewed_dustwallow_levels.lua
      - name: Test reviewed early-zone level patches (synthetic records only)
        run: lua5.1 tests/test_nquestie_reviewed_early_quest_levels.lua
      - name: Test guarded Duskwood and Wetlands level corrections (synthetic data)
        run: lua5.1 tests/test_nquestie_reviewed_classic_chain_levels.lua
      - name: Test selected quest SQL export parser
        run: python3 tools/test_export_world_quests.py
      - name: Test reviewed JSON to Lua generation (offline, fail closed)
        run: |
          # Keep local developer runs optional, but make CI fail rather than
          # silently skip the cross-language integration if Lua 5.1 vanishes.
          command -v lua5.1
          python3 tools/test_generate_custom_quests.py
      - name: Test private existing-quest level audit (synthetic data only)
        run: |
          python3 -m py_compile tools/audit_world_quest_levels.py
          python3 tools/test_audit_world_quest_levels.py
      - name: Guard approved early quest IDs against changed public Questie source
        run: python3 tools/test_reviewed_early_quest_sources.py
      - name: Verify real public Questie baselines for the two Classic chains
        run: python3 tools/test_reviewed_classic_chain_sources.py
      - name: Test 3.3.5a manifest preflight (synthetic, no package or upload)
        run: python3 tools/test_nquestie_335_manifest_preflight.py
      - name: Discover all Python tests and enforce the pinned identity inventory
        # Pinned at frozen #140 a503d6ce3cc536dbddfb6f4f802246ec578b6369.
        # Discovery of tools/test_*.py runs these 118 tests (11 modules):
        # 117 passes and exactly one intentional skip,
        # test_audit_world_quest_levels_counts.AuditCountAndOrderTests.test_repeated_correction_id_policy_is_not_stated.
        # That test is skipped because a repeated-correction policy is not stated
        # (DEV-063 overlap) and must not be chosen in this inventory.
        run: |
          set -euo pipefail
          discover_dir="$(mktemp -d)"
          set +e
          python3 -m unittest discover -s tools -p 'test_*.py' -v >"$discover_dir/stdout.txt" 2>"$discover_dir/stderr.txt"
          discover_status=$?
          set -e
          cat "$discover_dir/stdout.txt"
          cat "$discover_dir/stderr.txt" >&2
          python3 - "$discover_status" "$discover_dir/stderr.txt" <<'PY'
          import re
          import sys

          # Frozen inventory for a503d6ce3cc536dbddfb6f4f802246ec578b6369.
          # Discovery of tools/test_*.py runs these 118 tests: 117 passes and exactly
          # one intentional skip. The skip stays skipped because a repeated-correction
          # policy is not stated (DEV-063 overlap) and must not be chosen here.
          EXPECTED_SKIP_ID = (
              "test_audit_world_quest_levels_counts.AuditCountAndOrderTests"
              ".test_repeated_correction_id_policy_is_not_stated"
          )

          PINNED_TEST_IDS = (
              "test_audit_world_quest_levels.QuestLevelAuditTests.test_cli_incomplete_questie_source_preserves_private_report",
              "test_audit_world_quest_levels.QuestLevelAuditTests.test_cli_nonnumeric_questie_level_fails_closed_before_output",
              "test_audit_world_quest_levels.QuestLevelAuditTests.test_commas_and_escapes_in_lua",
              "test_audit_world_quest_levels.QuestLevelAuditTests.test_duplicate_world_quest_rejected_for_sql_and_zip",
              "test_audit_world_quest_levels.QuestLevelAuditTests.test_dynamic_fix_and_missing_questie_are_distinct",
              "test_audit_world_quest_levels.QuestLevelAuditTests.test_full_cli_synthetic_audit",
              "test_audit_world_quest_levels.QuestLevelAuditTests.test_mismatch_detection_with_literal_layer",
