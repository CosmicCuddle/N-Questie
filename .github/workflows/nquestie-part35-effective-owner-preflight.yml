name: N-Questie Part35 full effective owner preflight candidate

on:
  pull_request:

permissions:
  contents: read

jobs:
  effective-owner-335:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Lua 5.1 and 5.4
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get update -qq
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get install -y --no-install-recommends lua5.1 lua5.4
          lua5.1 -v 2>&1 | grep -E '^Lua 5\.1'
          lua5.4 -v 2>&1 | grep -E '^Lua 5\.4'
      - name: Validate Lua source and 21 fictional full owner checks
        shell: bash
        env:
          NQ_LOADER_PATH: Compat/NQuestieCustomQuestLoader.lua
        run: |
          set -euo pipefail
          luac5.1 -p Compat/NQuestieCustomQuestLoader.lua
          luac5.1 -p Modules/QuestieInit.lua
          luac5.1 -p tests/compat/nq_effective_owner_preflight_source.lua
          luac5.4 -p Compat/NQuestieCustomQuestLoader.lua
          luac5.4 -p Modules/QuestieInit.lua
          luac5.4 -p tests/compat/nq_effective_owner_preflight_source.lua
          for lua in lua5.1 lua5.4; do
            output="$RUNNER_TEMP/owner-$lua.log"
            timeout --signal=TERM --kill-after=5s 90s "$lua" tests/compat/nq_effective_owner_preflight_source.lua | tee "$output"
            test "$(grep -c '^PASS OWNER ' "$output")" -eq 21
            grep -Fx 'EFFECTIVE SOURCE OWNER RESULT: 21/21 PASS' "$output"
            grep -Fx 'CANDIDATE ONLY: no compiler yield freeze, client/IP or release permission' "$output"
          done
      - name: Assert no release or addon artifacts were assembled
        shell: bash
        run: |
          set -euo pipefail
          test ! -e dist/N-Questie.zip
          test ! -e .release-please-manifest.json
