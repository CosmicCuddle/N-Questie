name: N-Questie Part44 G08 actual DB Initialize creature-level cache (test only)
on:
  pull_request:
permissions:
  contents: read
jobs:
  original-db-creature-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Authenticate unchanged protected 335 original database source
        shell: bash
        run: |
          set -euo pipefail
          sha=8b23c6e2cfa00bb81cb26d40c44fef154e9e0070
          path=Database/QuestieDB.lua
          blob=5784cb65160175e1dce30fe20e8baada0af7e480
          timeout --signal=TERM --kill-after=5s 90s git fetch --no-tags --depth=1 origin "$sha"
          test "$(git rev-parse "$sha^{commit}")" = "$sha"
          test "$(git rev-parse "$sha:$path")" = "$blob"
          root="$RUNNER_TEMP/nq-part44-original-db-creature-cache"
          mkdir -p "$root/Database"
          git show "$sha:$path" > "$root/$path"
          test "$(git hash-object "$root/$path")" = "$blob"
          echo "PUBLIC G08 ORIGINAL QUESTIEDB GIT BLOB AUTHENTICATED"
      - name: Install Lua 5.1 and 5.4 for fictional DB reader data
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get update -qq
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get install -y --no-install-recommends lua5.1 lua5.4
          lua5.1 -v 2>&1 | grep -F 'Lua 5.1'
          lua5.4 -v 2>&1 | grep -F 'Lua 5.4'
      - name: Execute unchanged source functions and cache transition witnesses
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            if test "$lua" = lua5.1; then
              luac5.1 -p tests/compat/nq_part44_g08_original_db_creature_levels_cache_transition.lua
            else
              luac5.4 -p tests/compat/nq_part44_g08_original_db_creature_levels_cache_transition.lua
            fi
            log="$RUNNER_TEMP/nq-part44-db-creature-cache-$lua.log"
            NQ_G08_DB_CREATURE_CACHE_ROOT="$RUNNER_TEMP/nq-part44-original-db-creature-cache" timeout --signal=TERM --kill-after=5s 90s "$lua" tests/compat/nq_part44_g08_original_db_creature_levels_cache_transition.lua | tee "$log"
            grep -Fx 'PUBLIC G08 PART44 ACTUAL DB INIT AND CREATURE CACHE: 40/40 PASS' "$log"
            grep -Fxc 'PUBLIC G08 AUTHENTIC EXECUTION: unchanged entire original QuestieDB Initialize and GetCreatureLevels function bodies; original 5-cache resets, QueryItemSingle rebinding and CreatureLevelCache lookup/write with fictional GetDBHandle and NPCs.' "$log" | grep -Fx '1'
            grep -Fxc 'PUBLIC G08 NOT NATIVE: original full QuestieDB module, true decoder, compiler, QuestieStream, WOW UI, SavedVariables, IP 3.3.5a, actual writer, build, ZIP, install, merge and release NOT tested.' "$log" | grep -Fx '1'
            test "$(grep -Ec '^PUBLIC G08 ' "$log")" -eq 4
          done
      - name: No build ZIP outputs or mutated worktree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -d dist
          test ! -d releases
          test ! -d Questie-335
          test ! -e Questie.zip
          test ! -e N-Questie.zip
