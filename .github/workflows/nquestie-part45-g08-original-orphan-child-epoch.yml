name: N-Questie Part46 G08 integrated original quest cache completion (test only)
on:
  pull_request:
permissions:
  contents: read
jobs:
  orphan-child-and-epoch:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Authenticate exact immutable protected 335 code
        shell: bash
        run: |
          set -euo pipefail
          sha=8b23c6e2cfa00bb81cb26d40c44fef154e9e0070
          timeout --signal=TERM --kill-after=5s 90s git fetch --no-tags --depth=1 origin "$sha"
          test "$(git rev-parse "$sha^{commit}")" = "$sha"
          root="$RUNNER_TEMP/nq-part45-original-reset"
          mkdir -p "$root/Modules/Libs" "$root/Modules/Quest" "$root/Compat" "$root/Database"
          while read -r path blob; do
            test "$(git rev-parse "$sha:$path")" = "$blob"
            git show "$sha:$path" > "$root/$path"
            test "$(git hash-object "$root/$path")" = "$blob"
          done <<'BLOBS'
          Modules/Quest/QuestieQuest.lua cd4239c5b40c1f5b1ced823dfa12d8a895091719
          Modules/Quest/QuestLogCache.lua 09e9989922731f899994e6eb09af24465ae196ce
          Database/QuestieDB.lua 5784cb65160175e1dce30fe20e8baada0af7e480
          Modules/Quest/AvailableQuests.lua 2664f09fdf1f5df4d94581414e9d5ea88e9af4e7
          Modules/Libs/ThreadLib.lua 8f564049ad2a4af49473fac939b7c276c4227dd7
          Compat/Compat.lua b3e273e82cabbd5b7b351ae5aa3d94d4675387be
          BLOBS
          echo 'PUBLIC G08 PART45 COMBINED ORIGINAL SOURCE BLOBS VERIFIED'
      - name: Install clean Lua interpreters
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get update -qq
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get install -y --no-install-recommends lua5.1 lua5.4
      - name: Execute original child, writer, questlog and source-item source bodies
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            if test "$lua" = lua5.1; then luac5.1 -p tests/compat/nq_part45_g08_original_orphan_child_epoch_contract.lua
            else luac5.4 -p tests/compat/nq_part45_g08_original_orphan_child_epoch_contract.lua; fi
            log="$RUNNER_TEMP/nq-part45-original-$lua.log"
            NQ_PART45_ORIGINAL_ROOT="$RUNNER_TEMP/nq-part45-original-reset" timeout --signal=TERM --kill-after=5s 90s "$lua" tests/compat/nq_part45_g08_original_orphan_child_epoch_contract.lua | tee "$log"
            grep -Fx 'PUBLIC G08 PART45 ORIGINAL ORPHAN CHILD + EPOCH MODEL: 69/69 PASS' "$log"
            grep -Fx 'PUBLIC G08 PART46 ORPHAN WRITER AND GUARDED MODEL: 106/106 PASS' "$log"
            grep -Fx 'PUBLIC G08 PART46 AUTHENTIC QUESTLOG AND SOURCE ITEM: 129/129 PASS' "$log"
            test "$(grep -Ec '^PUBLIC G08 ' "$log")" -eq 14
          done
      - name: Run full original QuestLogCache readiness and fallback in synthetic API
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            if test "$lua" = lua5.1; then
              luac5.1 -p tests/compat/nq_part46_original_questlogcache_readiness.lua
            else
              luac5.4 -p tests/compat/nq_part46_original_questlogcache_readiness.lua
            fi
            log="$RUNNER_TEMP/nq-part46-cache-$lua.log"
            NQ_PART45_ORIGINAL_ROOT="$RUNNER_TEMP/nq-part45-original-reset" timeout --signal=TERM --kill-after=5s 90s "$lua" tests/compat/nq_part46_original_questlogcache_readiness.lua | tee "$log"
            grep -Fx 'PUBLIC G08 PART46 AUTHENTIC FULL QUESTLOGCACHE: 43/43 PASS' "$log"
            test "$(grep -Ec '^PUBLIC G08 ' "$log")" -eq 3
          done
      - name: Execute whole original QuestieDB cache creation and original QuestLogCache integration
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            if test "$lua" = lua5.1; then
              luac5.1 -p tests/compat/nq_part46_original_questiedb_object_cache.lua
            else
              luac5.4 -p tests/compat/nq_part46_original_questiedb_object_cache.lua
            fi
            log="$RUNNER_TEMP/nq-part46-db-cache-$lua.log"
            NQ_PART45_ORIGINAL_ROOT="$RUNNER_TEMP/nq-part45-original-reset" timeout --signal=TERM --kill-after=5s 90s "$lua" tests/compat/nq_part46_original_questiedb_object_cache.lua | tee "$log"
            grep -Fx 'PUBLIC G08 PART46 ORIGINAL FULL QUESTIEDB CACHE: 39/39 PASS' "$log"
            test "$(grep -Ec '^PUBLIC G08 ' "$log")" -eq 3
          done
      - name: Model-only forged current-owner ticket mutation controls
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            if test "$lua" = lua5.1; then
              luac5.1 -p tests/compat/nq_part46_g08_epoch_forged_ticket_mutant_controls.lua
            else
              luac5.4 -p tests/compat/nq_part46_g08_epoch_forged_ticket_mutant_controls.lua
            fi
            log="$RUNNER_TEMP/nq-part46-epoch-model-$lua.log"
            timeout --signal=TERM --kill-after=5s 90s "$lua" tests/compat/nq_part46_g08_epoch_forged_ticket_mutant_controls.lua | tee "$log"
            grep -Fx 'PUBLIC G08 PART46 EPOCH FORGED TICKET MODEL: 32/32 PASS' "$log"
            test "$(grep -Ec '^PUBLIC G08 ' "$log")" -eq 3
          done
      - name: Verify counterfactual registered descendant ownership and negative mutants
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            if test "$lua" = lua5.1; then
              luac5.1 -p tests/compat/nq_part46_g08_registered_descendant_owner_model.lua
            else
              luac5.4 -p tests/compat/nq_part46_g08_registered_descendant_owner_model.lua
            fi
            log="$RUNNER_TEMP/nq-part46-registered-owner-$lua.log"
            timeout --signal=TERM --kill-after=5s 90s "$lua" tests/compat/nq_part46_g08_registered_descendant_owner_model.lua | tee "$log"
            grep -Fx 'PUBLIC G08 PART46 REGISTERED DESCENDANT LEDGER: 65/65 PASS' "$log"
            test "$(grep -Ec '^PUBLIC G08 ' "$log")" -eq 3
          done
      - name: Execute original IsComplete and source-item methods against original QuestLogCache
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            if test "$lua" = lua5.1; then
              luac5.1 -p tests/compat/nq_part46_original_iscomplete_sourceitem_cache_contract.lua
            else
              luac5.4 -p tests/compat/nq_part46_original_iscomplete_sourceitem_cache_contract.lua
            fi
            log="$RUNNER_TEMP/nq-part46-iscomplete-$lua.log"
            NQ_PART45_ORIGINAL_ROOT="$RUNNER_TEMP/nq-part45-original-reset" timeout --signal=TERM --kill-after=5s 90s "$lua" tests/compat/nq_part46_original_iscomplete_sourceitem_cache_contract.lua | tee "$log"
            grep -Fx 'PUBLIC G08 PART46 ORIGINAL COMPLETE AND SOURCE ITEM: 40/40 PASS' "$log"
            test "$(grep -Ec '^PUBLIC G08 ' "$log")" -eq 3
          done
      - name: Execute integrated original QuestieDB cache completion and source-item chain
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            if test "$lua" = lua5.1; then
              luac5.1 -p tests/compat/nq_part46_integrated_original_db_cache_completion_source.lua
            else
              luac5.4 -p tests/compat/nq_part46_integrated_original_db_cache_completion_source.lua
            fi
            log="$RUNNER_TEMP/nq-part46-full-integrated-$lua.log"
            NQ_PART45_ORIGINAL_ROOT="$RUNNER_TEMP/nq-part45-original-reset" timeout --signal=TERM --kill-after=5s 90s "$lua" tests/compat/nq_part46_integrated_original_db_cache_completion_source.lua | tee "$log"
            grep -Fx 'PUBLIC G08 PART46 INTEGRATED REAL CACHE COMPLETE ITEM: 42/42 PASS' "$log"
            test "$(grep -Ec '^PUBLIC G08 ' "$log")" -eq 3
          done
      - name: Assert no distributed build or modified source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -d dist
          test ! -d releases
          test ! -e Questie.zip
          test ! -e N-Questie.zip
