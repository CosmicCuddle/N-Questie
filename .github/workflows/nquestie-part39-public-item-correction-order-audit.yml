name: N-Questie Part39 public item correction order audit (read-only)
on:
  pull_request:
permissions:
  contents: read
jobs:
  public-item-correction-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Lua 5.1 and 5.4
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get update -qq
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get install -y --no-install-recommends lua5.1 lua5.4
          lua5.1 -v 2>&1 | grep -F 'Lua 5.1'
          lua5.4 -v 2>&1 | grep -F 'Lua 5.4'
      - name: Survey public item correction layers for both factions
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            if [ "$lua" = lua5.1 ]; then
              luac5.1 -p tests/compat/nq_gate08_public_item_correction_order_audit.lua
            else
              luac5.4 -p tests/compat/nq_gate08_public_item_correction_order_audit.lua
            fi
            output="$RUNNER_TEMP/public-item-$lua.log"
            timeout --signal=TERM --kill-after=5s 90s "$lua" tests/compat/nq_gate08_public_item_correction_order_audit.lua | tee "$output"
            test "$(grep -c '^PUBLIC ITEM EFFECTIVE CONTROLS: 6/6 PASS$' "$output")" -eq 1
            test "$(grep -E -c '^PUBLIC WOTLK ITEM CORRECTED faction=(Alliance|Horde) rows=[0-9]+ simple_fields=[0-9]+ ordered=[0-9]+ reordered_dense=[0-9]+ malformed=[0-9]+ intentional_empty=[0-9]+ patch_writes=[0-9]+ faction_writes=[0-9]+ override_fields=[0-9]+$' "$output")" -eq 2
            test "$(grep -c '^PUBLIC WOTLK ITEM CORRECTED faction=Alliance ' "$output")" -eq 1
            test "$(grep -c '^PUBLIC WOTLK ITEM CORRECTED faction=Horde ' "$output")" -eq 1
            grep -Fx 'PUBLIC ITEM CORRECTION AUDIT COMPLETE (both factions)' "$output"
            grep -Fx 'SCOPE LIMIT: public WotLK items with Classic/TBC/WotLK item fixes, automatic starts and faction views ONLY.' "$output"
            grep -Fx 'NOT ACCEPTED: whole-four-kind effective Corrections, custom compat writers, source epoch, Stage1 and native client.' "$output"
          done
      - name: No packaging or workflow artifacts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e dist/N-Questie.zip
          test ! -e .release-please-manifest.json
