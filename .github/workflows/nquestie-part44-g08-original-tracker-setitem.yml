name: N-Questie Part44 G08 authentic Tracker SetItem item generation (test only)
on:
  pull_request:
permissions:
  contents: read
jobs:
  original-tracker-setitem:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Authenticate pinned original protected 335 TrackerLinePool
        shell: bash
        run: |
          set -euo pipefail
          sha=8b23c6e2cfa00bb81cb26d40c44fef154e9e0070
          path=Modules/Tracker/TrackerLinePool.lua
          blob=e7e9f6b8539080b3934def64779a49c0fc2a6b6b
          timeout --signal=TERM --kill-after=5s 90s git fetch --no-tags --depth=1 origin "$sha"
          test "$(git rev-parse "$sha^{commit}")" = "$sha"
          test "$(git rev-parse "$sha:$path")" = "$blob"
          root="$RUNNER_TEMP/nq-part44-original-tracker"
          mkdir -p "$root/Modules/Tracker"
          git show "$sha:$path" > "$root/$path"
          test "$(git hash-object "$root/$path")" = "$blob"
          echo "PUBLIC G08 ORIGINAL TRACKER BLOB VERIFIED"
      - name: Install Lua 5.1 and Lua 5.4
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get update -qq
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get install -y --no-install-recommends lua5.1 lua5.4
          lua5.1 -v 2>&1 | grep -F 'Lua 5.1'
          lua5.4 -v 2>&1 | grep -F 'Lua 5.4'
      - name: Execute actual original SetItem closure with synthetic inventories
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            if test "$lua" = lua5.1; then
              luac5.1 -p tests/compat/nq_part44_g08_original_tracker_setitem_generation.lua
            else
              luac5.4 -p tests/compat/nq_part44_g08_original_tracker_setitem_generation.lua
            fi
            log="$RUNNER_TEMP/nq-part44-tracker-$lua.log"
            NQ_G08_TRACKER_SETITEM_ROOT="$RUNNER_TEMP/nq-part44-original-tracker" timeout --signal=TERM --kill-after=5s 90s "$lua" tests/compat/nq_part44_g08_original_tracker_setitem_generation.lua | tee "$log"
            grep -Fx 'PUBLIC G08 PART44 ORIGINAL TRACKER SETITEM: 35/35 PASS' "$log"
            grep -Fxc 'PUBLIC G08 REAL SOURCE: original unchanged TrackerLinePool btn.SetItem entire function fragment executes with synthetic bag, inventory, item query and UI sinks; NOT entire TrackerLinePool.Initialize/module.' "$log" | grep -Fx '1'
            grep -Fxc 'PUBLIC G08 NOT NATIVE: no actual WoW bag/inventory/frame, tracker initialization, native GetDBHandle, QuestieStream, SavedVariables, 3.3.5a/IP, packaging, build, install, merge or release.' "$log" | grep -Fx '1'
            test "$(grep -Ec '^PUBLIC G08 ' "$log")" -eq 4
          done
      - name: Confirm no build/package outputs and clean worktree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -d releases
          test ! -d dist
          test ! -d Questie-335
          test ! -e Questie.zip
          test ! -e N-Questie.zip
