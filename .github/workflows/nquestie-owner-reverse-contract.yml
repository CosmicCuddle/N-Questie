name: N-Questie NPC/GO reverse ownership (synthetic contract only)

on:
  pull_request:

permissions:
  contents: read

jobs:
  owner-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout test-only isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install and identify Lua 5.1 and 5.4
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get update -qq
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get install -y --no-install-recommends lua5.1 lua5.4
          lua5.1 -v 2>&1 | grep -E '^Lua 5\.1'
          lua5.4 -v 2>&1 | grep -E '^Lua 5\.4'
      - name: Run exact 34 fictional ownership cases on both Luas
        shell: bash
        run: |
          set -euo pipefail
          luac5.1 -p tests/compat/nq_owner_reverse_contract.lua
          luac5.4 -p tests/compat/nq_owner_reverse_contract.lua
          for lua in lua5.1 lua5.4; do
            log="$RUNNER_TEMP/nq-owner-$lua.log"
            timeout --signal=TERM --kill-after=5s 60s "$lua" tests/compat/nq_owner_reverse_contract.lua | tee "$log"
            test "$(grep -c '^PASS OWNER ' "$log")" -eq 34
            test "$(grep -Fxc 'OWNER REVERSE PROPOSAL RESULT: 34/34 PASS' "$log")" -eq 1
            grep -Fx 'TEST ONLY: excludes compiler-yield freeze, live client and item source proof' "$log"
            if grep -Eq '^(FAIL OWNER|OWNER CONTRACT)' "$log"; then
              echo "FAIL: $lua has unexpected test error" >&2
              exit 1
            fi
            echo "VERIFIED synthetic owner contract with $lua"
          done
