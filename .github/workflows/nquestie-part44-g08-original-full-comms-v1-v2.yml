name: N-Questie Part44 G08 full original Comms V1/V2 generations (test only)
on:
  pull_request:
permissions:
  contents: read
jobs:
  original-comms-full-broadcast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Authenticate immutable protected 335 original Comms source
        shell: bash
        run: |
          set -euo pipefail
          sha=8b23c6e2cfa00bb81cb26d40c44fef154e9e0070
          path=Modules/Network/QuestieComms.lua
          blob=400dbfaec895517cea7cd283e6ec20404f46a7b7
          timeout --signal=TERM --kill-after=5s 90s git fetch --no-tags --depth=1 origin "$sha"
          test "$(git rev-parse "$sha^{commit}")" = "$sha"
          test "$(git rev-parse "$sha:$path")" = "$blob"
          root="$RUNNER_TEMP/nq-part44-original-full-comms"
          mkdir -p "$root/Modules/Network"
          git show "$sha:$path" > "$root/$path"
          test "$(git hash-object "$root/$path")" = "$blob"
          echo "PUBLIC G08 PART44 ORIGINAL COMPLETE COMMS SHA AUTHENTICATED"
      - name: Install Lua 5.1 and Lua 5.4 for fictional Comms environment
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get update -qq
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get install -y --no-install-recommends lua5.1 lua5.4
          lua5.1 -v 2>&1 | grep -F 'Lua 5.1'
          lua5.4 -v 2>&1 | grep -F 'Lua 5.4'
      - name: Source execute full original V1 and V2 functions with zero real networking
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            if test "$lua" = lua5.1; then
              luac5.1 -p tests/compat/nq_part44_g08_full_original_comms_generation_broadcast.lua
            else
              luac5.4 -p tests/compat/nq_part44_g08_full_original_comms_generation_broadcast.lua
            fi
            logfile="$RUNNER_TEMP/nq-original-comms-$lua.log"
            NQ_G08_FULL_COMMS_ROOT="$RUNNER_TEMP/nq-part44-original-full-comms" timeout --signal=TERM --kill-after=5s 90s "$lua" tests/compat/nq_part44_g08_full_original_comms_generation_broadcast.lua | tee "$logfile"
            grep -Fx 'PUBLIC G08 PART44 FULL ORIGINAL COMMS V1 V2: 46/46 PASS' "$logfile"
            grep -Fxc 'PUBLIC G08 ORIGINAL EXECUTION: unchanged complete QuestieComms.lua loaded; actual full BroadcastQuestLog and BroadcastQuestLogV2, CreateQuestDataPacket, PopulateQuestDataPacketV2_noclass_renameme, CreatePacket, Broadcast and delayed callbacks executed.' "$logfile" | grep -Fx '1'
            grep -Fxc 'PUBLIC G08 SAFETY: fake SendCommMessage only records calls; no actual network traffic, real serializer, client timer, AzerothCore/IP client, SavedVariables, compiler, stream, build, ZIP, install, protected merge or release.' "$logfile" | grep -Fx '1'
            test "$(grep -Ec '^PUBLIC G08 ' "$logfile")" -eq 4
          done
      - name: Confirm clean checkout and no outputs
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -d releases
          test ! -d dist
          test ! -d Questie-335
          test ! -e Questie.zip
          test ! -e N-Questie.zip
