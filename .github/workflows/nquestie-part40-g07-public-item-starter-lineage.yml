name: N-Questie Part40 public Gate07 item-start source lineage (test-only)
on:
  pull_request:
permissions:
  contents: read
jobs:
  public-g07-item-starter:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Read consistent pinned protected-335 public source (never modify it)
        shell: bash
        run: |
          set -euo pipefail
          source_sha=8b23c6e2cfa00bb81cb26d40c44fef154e9e0070
          timeout --signal=TERM --kill-after=5s 90s git fetch --no-tags --depth=1 origin "$source_sha"
          test "$(git rev-parse FETCH_HEAD)" = "$source_sha"
          mkdir -p "$RUNNER_TEMP/nq-protected-g07/Database" "$RUNNER_TEMP/nq-protected-g07/Modules/Quest"
          # Independent immutable Git blob pins (retrieved from protected 335).
          # A behavioural match alone is NOT an exact-content integrity proof.
          # Verify each tree object AND staged temp file against the literal pin.
          for file in Database/itemDB.lua Database/questDB.lua Database/QuestieDB.lua Modules/Quest/AvailableQuests.lua; do
            case "$file" in
              Database/itemDB.lua) expected_blob=a714c1a11ce0513276de3f9ce9015d7db22efa80 ;;
              Database/questDB.lua) expected_blob=9503b16031e739d9c0f046939058229b1a18d9b1 ;;
              Database/QuestieDB.lua) expected_blob=5784cb65160175e1dce30fe20e8baada0af7e480 ;;
              Modules/Quest/AvailableQuests.lua) expected_blob=2664f09fdf1f5df4d94581414e9d5ea88e9af4e7 ;;
              *) echo "G07_UNEXPECTED_PUBLIC_SOURCE_FILE" >&2; exit 1 ;;
            esac
            test "$(git rev-parse "$source_sha:$file")" = "$expected_blob"
            git show "$source_sha:$file" > "$RUNNER_TEMP/nq-protected-g07/$file"
            test -s "$RUNNER_TEMP/nq-protected-g07/$file"
            test "$(git hash-object -- "$RUNNER_TEMP/nq-protected-g07/$file")" = "$expected_blob"
          done
          echo "PUBLIC G07 FOUR SOURCE BLOBS MATCH PINNED 335"
      - name: Install Lua 5.1 and Lua 5.4
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get update -qq
          timeout --signal=TERM --kill-after=5s 180s sudo apt-get install -y --no-install-recommends lua5.1 lua5.4
          lua5.1 -v 2>&1 | grep -F 'Lua 5.1'
          lua5.4 -v 2>&1 | grep -F 'Lua 5.4'
      - name: Verify public source lineage and real available renderer with imaginary IDs
        shell: bash
        run: |
          set -euo pipefail
          for lua in lua5.1 lua5.4; do
            if [ "$lua" = lua5.1 ]; then
              luac5.1 -p tests/compat/nq_gate07_public_item_starter_lineage.lua
            else
              luac5.4 -p tests/compat/nq_gate07_public_item_starter_lineage.lua
            fi
            output="$RUNNER_TEMP/g07-public-$lua.log"
            NQ_G07_SOURCE_ROOT="$RUNNER_TEMP/nq-protected-g07" timeout --signal=TERM --kill-after=5s 100s "$lua" tests/compat/nq_gate07_public_item_starter_lineage.lua | tee "$output"
            grep -Fx 'PUBLIC G07 ITEM STARTER LINEAGE CONTROLS: 15/15 PASS' "$output"
            grep -Fx 'PUBLIC G07 LIMIT: item-only source creates no NPC/GO map pin in the tested renderer, NOT an eligibility verdict.' "$output"
            grep -Fx 'PUBLIC G07 NOT ACCEPTED: complete GetQuest execution, actual item use/start, server IP phase, source integrity, native WoW 3.3.5a UI or SavedVariables.' "$output"
            test "$(grep -Ec '^PUBLIC G07 ' "$output")" -eq 3
          done
      - name: No release or packaging
        shell: bash
        run: |
          set -euo pipefail
          test ! -e dist/N-Questie.zip
          test ! -e .release-please-manifest.json
